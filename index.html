<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Montemar Administradores</title>
<meta name="description" content="Administramos condominios, edificios y locales comerciales en la Región de Valparaíso con transparencia, eficiencia y tecnología de vanguardia." />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; }
</style>
</head>
<body class="bg-white text-slate-800">
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

const NAV = [
  { label: "Nosotros", href: "#nosotros" },
  { label: "Servicios", href: "#servicios" },
  { label: "Metodología", href: "#metodologia" },
  { label: "Contacto", href: "#contacto" },
];

const VALUES = ["TRANSPARENCIA", "RESPONSABILIDAD", "EFICIENCIA", "INNOVACIÓN", "CERCANÍA"];

const TEAM = [
  {
    name: "Carlos Bastías",
    role: "ADMINISTRADOR · PUC",
    bio: "Cirujano Dentista y Magíster en Gestión y Administración en Salud. Experiencia en gestión clínica, de personal, procesos, capacitaciones y acreditaciones en centros médicos.",
  },
  {
    name: "Paola Pérez",
    role: "ADMINISTRADORA · PUC",
    bio: "Oficial de Ejército (R), especialista en finanzas y recursos humanos. Experiencia en gestión contable, financiera y de personal en organizaciones de alta complejidad.",
  },
];

const SERVICES = [
  { n: "01", title: "Gestión Financiera y Contable", desc: "Control de saldos, fondos de reserva, conciliaciones, contabilidad completa y reportes digitales." },
  { n: "02", title: "Cobranza de Morosidad", desc: "Gestión ordinaria, prejudicial y judicial con seguimiento documentado y comunicación transparente." },
  { n: "03", title: "Recursos Humanos", desc: "Contratación, liquidaciones, licencias médicas, finiquitos y revisión de contratos y subcontratos." },
  { n: "04", title: "Operación y Mantenimiento", desc: "Plan preventivo y correctivo, coordinación de proveedores certificados y gestión de seguros." },
  { n: "05", title: "Seguridad y Emergencias", desc: "Planes de emergencia, simulacros periódicos y supervisión de mantenciones obligatorias." },
  { n: "06", title: "Comunicación con Residentes", desc: "Canales eficientes, visitas regulares, disponibilidad ante emergencias y encuestas de satisfacción." },
  { n: "07", title: "Tecnología y Transparencia", desc: "ComunidadFeliz, herramientas digitales propias y reportes frecuentes al comité de administración." },
  { n: "08", title: "Actualización Normativa", desc: "Optimización de flujos, reglamento de copropiedad actualizado y comunicación interna mejorada." },
];

const METHOD = [
  { n: "01", title: "Evaluación inicial", desc: "Conocemos en profundidad la situación actual de la comunidad, su reglamento, finanzas y necesidades específicas." },
  { n: "02", title: "Plan de gestión personalizado", desc: "Diseñamos un plan adaptado a la realidad y expectativas del condominio, con objetivos claros y medibles." },
  { n: "03", title: "Implementación de protocolos", desc: "Establecemos flujos de trabajo, protocolos de emergencia y canales de comunicación eficientes." },
  { n: "04", title: "Monitoreo y reportes", desc: "Seguimiento continuo con reportes periódicos digitales al comité para garantizar plena transparencia." },
  { n: "05", title: "Reuniones de seguimiento", desc: "Reuniones regulares con el comité de administración para alinear decisiones y mantener la confianza." },
];

// Replace this with your real Formspree endpoint (see setup instructions).
const FORMSPREE_ENDPOINT = "https://formspree.io/f/mbgrrjrd";

function Header() {
  const [open, setOpen] = useState(false);
  return (
    <header className="sticky top-0 z-50 bg-white/90 backdrop-blur border-b border-slate-100">
      <div className="max-w-6xl mx-auto px-5 py-4 flex items-center justify-between">
        <div>
          <div className="font-bold text-lg tracking-tight text-slate-900">Montemar Administradores</div>
          <div className="text-xs text-slate-500 tracking-widest">CONCÓN · VALPARAÍSO</div>
        </div>
        <nav className="hidden md:flex items-center gap-8 text-sm font-medium text-slate-600">
          {NAV.map((item) => (
            <a key={item.href} href={item.href} className="hover:text-slate-900 transition">{item.label}</a>
          ))}
          <a href="#contacto" className="bg-slate-900 text-white px-4 py-2 rounded-full hover:bg-slate-700 transition">CONTACTO</a>
        </nav>
        <button className="md:hidden text-slate-700" onClick={() => setOpen(!open)} aria-label="Menú">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
        </button>
      </div>
      {open && (
        <div className="md:hidden px-5 pb-4 flex flex-col gap-3 text-sm font-medium text-slate-600">
          {NAV.map((item) => (
            <a key={item.href} href={item.href} onClick={() => setOpen(false)}>{item.label}</a>
          ))}
        </div>
      )}
    </header>
  );
}

function Hero() {
  return (
    <section className="max-w-6xl mx-auto px-5 pt-16 pb-20 text-center">
      <div className="text-xs font-semibold tracking-widest text-emerald-700 bg-emerald-50 inline-block px-3 py-1 rounded-full mb-6">
        ADMINISTRACIÓN PROFESIONAL · LEY 21.442
      </div>
      <h1 className="text-4xl md:text-6xl font-extrabold text-slate-900 leading-tight max-w-4xl mx-auto">
        Gestión que genera confianza en cada comunidad
      </h1>
      <p className="mt-6 text-lg text-slate-600 max-w-2xl mx-auto">
        Administramos condominios, edificios y locales comerciales en la Región de Valparaíso con transparencia, eficiencia y tecnología de vanguardia.
      </p>
      <div className="mt-8 flex flex-col sm:flex-row gap-4 justify-center">
        <a href="#contacto" className="bg-slate-900 text-white px-6 py-3 rounded-full font-medium hover:bg-slate-700 transition">Solicitar cotización</a>
        <a href="#servicios" className="border border-slate-300 text-slate-700 px-6 py-3 rounded-full font-medium hover:border-slate-500 transition">Ver servicios</a>
      </div>
    </section>
  );
}

function Nosotros() {
  return (
    <section id="nosotros" className="bg-slate-50 py-20">
      <div className="max-w-6xl mx-auto px-5">
        <div className="text-xs font-semibold tracking-widest text-emerald-700 mb-3">QUIÉNES SOMOS</div>
        <h2 className="text-3xl md:text-4xl font-bold text-slate-900 max-w-2xl">
          Profesionales certificados al servicio de su comunidad
        </h2>
        <p className="mt-5 text-slate-600 max-w-2xl">
          Somos Montemar Administradores SpA, fundada por administradores certificados por la Pontificia Universidad Católica. Combinamos formación académica, experiencia en gestión clínica y financiera, y tecnología moderna para entregar un servicio integral y personalizado.
        </p>
        <div className="mt-8 flex flex-wrap gap-3">
          {VALUES.map((v) => (
            <span key={v} className="text-xs font-semibold tracking-wider bg-white border border-slate-200 text-slate-600 px-3 py-2 rounded-full">{v}</span>
          ))}
        </div>
        <div className="mt-12 grid md:grid-cols-2 gap-6">
          {TEAM.map((p) => (
            <div key={p.name} className="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm">
              <div className="font-bold text-slate-900 text-lg">{p.name}</div>
              <div className="text-xs font-semibold tracking-widest text-emerald-700 mt-1 mb-3">{p.role}</div>
              <p className="text-sm text-slate-600 leading-relaxed">{p.bio}</p>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

function Servicios() {
  return (
    <section id="servicios" className="py-20">
      <div className="max-w-6xl mx-auto px-5">
        <div className="text-xs font-semibold tracking-widest text-emerald-700 mb-3">SERVICIOS</div>
        <h2 className="text-3xl md:text-4xl font-bold text-slate-900 max-w-2xl">
          Todo lo que su comunidad necesita
        </h2>
        <p className="mt-5 text-slate-600 max-w-2xl">
          Cubrimos cada área de la administración para que su comunidad opere de forma eficiente, segura y transparente — desde las finanzas hasta la convivencia.
        </p>
        <div className="mt-12 grid sm:grid-cols-2 lg:grid-cols-4 gap-6">
          {SERVICES.map((s) => (
            <div key={s.n} className="border border-slate-100 rounded-2xl p-6 hover:shadow-md transition">
              <div className="text-2xl font-extrabold text-slate-200 mb-3">{s.n}</div>
              <div className="font-semibold text-slate-900 mb-2">{s.title}</div>
              <p className="text-sm text-slate-600 leading-relaxed">{s.desc}</p>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

function Metodologia() {
  return (
    <section id="metodologia" className="bg-slate-900 text-white py-20">
      <div className="max-w-6xl mx-auto px-5">
        <div className="text-xs font-semibold tracking-widest text-emerald-400 mb-3">METODOLOGÍA</div>
        <h2 className="text-3xl md:text-4xl font-bold mb-12">Cómo trabajamos</h2>
        <div className="grid md:grid-cols-5 gap-8">
          {METHOD.map((m) => (
            <div key={m.n}>
              <div className="text-3xl font-extrabold text-emerald-400 mb-3">{m.n}</div>
              <div className="font-semibold mb-2">{m.title}</div>
              <p className="text-sm text-slate-300 leading-relaxed">{m.desc}</p>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

function Contacto() {
  const [status, setStatus] = useState("idle"); // idle | sending | sent | error

  async function handleSubmit(e) {
    e.preventDefault();
    setStatus("sending");
    const form = e.target;
    const data = new FormData(form);
    try {
      const res = await fetch(FORMSPREE_ENDPOINT, {
        method: "POST",
        body: data,
        headers: { Accept: "application/json" },
      });
      if (res.ok) {
        setStatus("sent");
        form.reset();
      } else {
        setStatus("error");
      }
    } catch (err) {
      setStatus("error");
    }
  }

  return (
    <section id="contacto" className="py-20">
      <div className="max-w-6xl mx-auto px-5">
        <div className="text-xs font-semibold tracking-widest text-emerald-700 mb-3">CONTÁCTENOS</div>
        <h2 className="text-3xl md:text-4xl font-bold text-slate-900 mb-12">Hablemos de su comunidad</h2>
        <div className="grid md:grid-cols-2 gap-12">
          <div className="space-y-6">
            <div>
              <div className="text-xs font-semibold tracking-widest text-slate-400 mb-1">UBICACIÓN</div>
              <div className="text-slate-800">Concón, Región de Valparaíso, Chile</div>
            </div>
            <div>
              <div className="text-xs font-semibold tracking-widest text-slate-400 mb-1">CARLOS BASTÍAS</div>
              <div className="text-slate-800">+56 9 8289 5571</div>
            </div>
            <div>
              <div className="text-xs font-semibold tracking-widest text-slate-400 mb-1">PAOLA PÉREZ</div>
              <div className="text-slate-800">+56 9 9087 3880</div>
            </div>
            <div>
              <div className="text-xs font-semibold tracking-widest text-slate-400 mb-1">CORREO</div>
              <div className="text-slate-800">contacto@montemaradm.cl</div>
            </div>
            <div>
              <div className="text-xs font-semibold tracking-widest text-slate-400 mb-1">SITIO WEB</div>
              <div className="text-slate-800">www.montemaradm.cl</div>
            </div>
            <div>
              <div className="text-xs font-semibold tracking-widest text-slate-400 mb-1">INSTAGRAM</div>
              <div className="text-slate-800">@montemaradministradores</div>
            </div>
          </div>

          <form onSubmit={handleSubmit} className="bg-slate-50 rounded-2xl p-6 space-y-4">
            <div className="font-semibold text-slate-900 mb-2">Envíenos un mensaje</div>
            <input name="nombre" required placeholder="Nombre" className="w-full border border-slate-200 rounded-lg px-4 py-3 text-sm" />
            <input name="telefono" placeholder="Teléfono" className="w-full border border-slate-200 rounded-lg px-4 py-3 text-sm" />
            <input name="email" type="email" required placeholder="Correo electrónico" className="w-full border border-slate-200 rounded-lg px-4 py-3 text-sm" />
            <select name="tipo_propiedad" defaultValue="" className="w-full border border-slate-200 rounded-lg px-4 py-3 text-sm text-slate-600">
              <option value="" disabled>Tipo de propiedad</option>
              <option>Condominio residencial</option>
              <option>Edificio de departamentos</option>
              <option>Local comercial / Oficina</option>
              <option>Otro</option>
            </select>
            <textarea name="mensaje" required placeholder="Mensaje" rows="4" className="w-full border border-slate-200 rounded-lg px-4 py-3 text-sm"></textarea>
            <button type="submit" disabled={status === "sending"} className="w-full bg-slate-900 text-white py-3 rounded-lg font-medium hover:bg-slate-700 transition disabled:opacity-50">
              {status === "sending" ? "Enviando..." : "Enviar mensaje"}
            </button>
            {status === "sent" && <div className="text-sm text-emerald-700">¡Mensaje enviado! Le responderemos a la brevedad.</div>}
            {status === "error" && <div className="text-sm text-red-600">Hubo un problema al enviar. Intente nuevamente o escríbanos directamente a contacto@montemaradm.cl.</div>}
          </form>
        </div>
      </div>
    </section>
  );
}

function Footer() {
  return (
    <footer className="border-t border-slate-100 py-10">
      <div className="max-w-6xl mx-auto px-5 flex flex-col md:flex-row justify-between gap-6">
        <div>
          <div className="font-bold text-slate-900">Montemar Administradores SpA</div>
          <div className="text-sm text-slate-500 mt-1">Concón, Región de Valparaíso · Ley 21.442</div>
        </div>
        <nav className="flex gap-6 text-sm text-slate-600">
          {NAV.map((item) => (
            <a key={item.href} href={item.href} className="hover:text-slate-900">{item.label}</a>
          ))}
        </nav>
      </div>
      <div className="max-w-6xl mx-auto px-5 mt-6 text-xs text-slate-400">
        © 2026 Montemar Administradores SpA. Todos los derechos reservados.
      </div>
    </footer>
  );
}

function App() {
  return (
    <div>
      <Header />
      <Hero />
      <Nosotros />
      <Servicios />
      <Metodologia />
      <Contacto />
      <Footer />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
