              <p className="text-sm text-slate-600 leading-relaxed">{s.desc}</p>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

function Contacto() {
  const [status, setStatus] = useState("idle"); // idle | sending | sent | error

  async function handleSubmit(e) {
    e.preventDefault();
    setStatus("sending");
    const form = e.target;
    const data = new FormData(form);
    try {
      const res = await fetch(FORMSPREE_ENDPOINT, {
        method: "POST",
        body: data,
        headers: { Accept: "application/json" },
      });
      if (res.ok) {
        setStatus("sent");
        form.reset();
      } else {
        setStatus("error");
      }
    } catch (err) {
      setStatus("error");
    }
  }

  return (
    <section id="contacto" className="py-20">
      <div className="max-w-6xl mx-auto px-5">
        <div className="text-xs font-semibold tracking-widest text-orange-500 mb-3">CONTÁCTENOS</div>
        <h2 className="text-3xl md:text-4xl font-bold text-slate-900 mb-12">Hablemos de su comunidad</h2>
        <div className="grid md:grid-cols-2 gap-12">
          <div className="space-y-6">
            <div>
              <div className="text-xs font-semibold tracking-widest text-slate-400 mb-1">UBICACIÓN</div>
              <div className="text-slate-800">Av. San Fernando 46, Concón, Región de Valparaíso</div>
            </div>
            <div>
              <div className="text-xs font-semibold tracking-widest text-slate-400 mb-1">CARLOS BASTÍAS</div>
              <div className="text-slate-800">+56 9 8289 5571</div>
            </div>
            <div>
              <div className="text-xs font-semibold tracking-widest text-slate-400 mb-1">PAOLA PÉREZ</div>
              <div className="text-slate-800">+56 9 9087 3880</div>
            </div>
            <div>
              <div className="text-xs font-semibold tracking-widest text-slate-400 mb-1">JORGE CABRERA</div>
              <div className="text-slate-800">+56 9 9864 5066</div>
            </div>
            <div>
              <div className="text-xs font-semibold tracking-widest text-slate-400 mb-1">DIEGO BRANTE</div>
              <div className="text-slate-800">+56 9 8195 4669</div>
            </div>
            <div>
              <div className="text-xs font-semibold tracking-widest text-slate-400 mb-1">CORREO</div>
              <div className="text-slate-800">contacto@montemaradm.cl</div>
            </div>
            <div>
              <div className="text-xs font-semibold tracking-widest text-slate-400 mb-1">SITIO WEB</div>
              <div className="text-slate-800">www.montemaradm.cl</div>
            </div>
            <div>
              <div className="text-xs font-semibold tracking-widest text-slate-400 mb-1">INSTAGRAM</div>
              <div className="text-slate-800">@montemaradministradores</div>
            </div>
          </div>

          <form onSubmit={handleSubmit} className="bg-slate-50 rounded-2xl p-6 space-y-4">
            <div className="font-semibold text-slate-900 mb-2">Envíenos un mensaje</div>
            <input name="nombre" required placeholder="Nombre" className="w-full border border-slate-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300" />
            <input name="telefono" placeholder="Teléfono" className="w-full border border-slate-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300" />
            <input name="email" type="email" required placeholder="Correo electrónico" className="w-full border border-slate-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300" />
            <select name="tipo_propiedad" defaultValue="" className="w-full border border-slate-200 rounded-lg px-4 py-3 text-sm text-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-300">
              <option value="" disabled>Tipo de propiedad</option>
              <option>Condominio residencial</option>
              <option>Edificio de departamentos</option>
              <option>Local comercial / Oficina</option>
              <option>Otro</option>
            </select>
            <textarea name="mensaje" required placeholder="Mensaje" rows="4" className="w-full border border-slate-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"></textarea>
            <button type="submit" disabled={status === "sending"} className="w-full bg-blue-700 text-white py-3 rounded-lg font-medium hover:bg-blue-800 transition disabled:opacity-50">
              {status === "sending" ? "Enviando..." : "Enviar mensaje"}
            </button>
            {status === "sent" && <div className="text-sm text-blue-700">¡Mensaje enviado! Le responderemos a la brevedad.</div>}
            {status === "error" && <div className="text-sm text-red-600">Hubo un problema al enviar. Intente nuevamente o escríbanos directamente a contacto@montemaradm.cl.</div>}
          </form>
        </div>
      </div>
    </section>
  );
}
